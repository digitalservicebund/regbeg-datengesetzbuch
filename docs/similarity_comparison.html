<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pflichten-Vergleich</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #1a202c;
      --text-muted: #64748b;
      --accent: #2563eb;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    #ai-disclaimer {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      text-align: center;
      border-radius: 6px;
      margin: -1rem -1rem 1.5rem -1rem;
    }

    footer.legal-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      font-size: 0.8rem;
      margin-top: 2rem;
    }
    footer.legal-links a { color: var(--text-muted); text-decoration: none; }
    footer.legal-links a:hover { color: var(--accent); text-decoration: underline; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .score-badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }

    .comparison-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      table-layout: fixed;
    }

    .comparison-table th,
    .comparison-table td {
      padding: 0.75rem 1.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .comparison-table thead th {
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid var(--border);
    }

    .comparison-table th.prop-col {
      width: 250px;
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 600;
    }

    .duty-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
    }

    .duty-label {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      word-break: break-all;
    }

    .prop-name {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .val-text {
      color: var(--text);
      line-height: 1.5;
      font-size: 1rem;
      font-weight: 500;
    }

    .val-block {
      line-height: 1.65;
      font-style: italic;
      color: #334155;
      font-size: 1rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 100;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .comparison-table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Daten werden geladen...</p>
  </div>

  <div class="container" id="main-content" style="display: none;">
    <div id="ai-disclaimer">⚠️ Die hier dargestellten Ergebnisse wurden mit Hilfe von künstlicher Intelligenz erstellt. Sie können Fehler enthalten und sind nicht rechtsverbindlich.</div>

    <header>
      <h1 id="title">Pflichten-Vergleich</h1>
      <div id="score-wrap">
        <span class="score-badge" id="score-val">–</span>
      </div>
    </header>

    <table class="comparison-table">
      <thead>
        <tr>
          <th class="prop-col">Merkmal</th>
          <th id="th-p1">
            <div class="duty-title">Pflicht 1</div>
            <div class="duty-label" id="lbl-p1">...</div>
          </th>
          <th id="th-p2">
            <div class="duty-title">Pflicht 2</div>
            <div class="duty-label" id="lbl-p2">...</div>
          </th>
        </tr>
      </thead>
      <tbody id="comparison-body">
        <!-- Rows added via JS -->
      </tbody>
    </table>

    <footer class="legal-links">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutzerkl%C3%A4rung.html">Datenschutz</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
    const CSV_BASE_URL = "data/Meldepflichten_LLM_";

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const p1 = params.get("p1");
      const p2 = params.get("p2");
      const score = params.get("score");
      const i1 = params.get("i1");
      const i2 = params.get("i2");

      if (!p1 || !p2) {
        document.body.innerHTML = "<h1>Fehlende Parameter</h1><p>Bitte rufen Sie diese Seite über die Heatmap auf.</p>";
        return;
      }

      if (score) {
        document.getElementById("score-val").textContent = `Ähnlichkeit: ${parseFloat(score).toFixed(1)}%`;
      } else {
        document.getElementById("score-wrap").style.display = "none";
        document.getElementById("title").textContent = "Pflicht-Detailansicht";
      }

      const [m1, m2] = await Promise.all([fetchMeta(p1, i1), fetchMeta(p2, i2)]);

      document.getElementById("lbl-p1").textContent = p1.split(" #")[0];
      document.getElementById("lbl-p2").textContent = p2.split(" #")[0];

      renderTable(m1, m2);

      document.getElementById("loading").style.display = "none";
      document.getElementById("main-content").style.display = "block";
    }

    async function fetchMeta(lbl, explicitIdx) {
      const parts = lbl.split(":");
      const norm = parts[0];
      const rest = parts.slice(1).join(":");
      const match = rest.match(/#(\d+)/);

      let localIdx;
      if (explicitIdx !== null && explicitIdx !== undefined) {
        localIdx = parseInt(explicitIdx);
      } else if (match) {
        localIdx = parseInt(match[1]);
      } else {
        return {};
      }

      try {
        const response = await fetch(`${CSV_BASE_URL}${norm}.csv`);
        const text = await response.text();
        const cleanText = text.replace(/^\uFEFF/, "");
        const rows = d3.dsvFormat(";").parse(cleanText);
        return rows[localIdx] || {};
      } catch (e) {
        console.error(`Error loading norm ${norm}:`, e);
        return {};
      }
    }

    function renderTable(m1, m2) {
      const tbody = document.getElementById("comparison-body");
      const skip = ["_localIdx"];
      const blocks = ["Was gemeldet wird", "Zitat"];
      
      const allKeys = Array.from(new Set([...Object.keys(m1), ...Object.keys(m2)]));
      const topKeys = ["Norm", "Referenz"];
      const displayKeys = [...topKeys, ...allKeys.filter(k => !topKeys.includes(k) && !skip.includes(k) && k !== "row_")];

      let html = "";
      displayKeys.forEach(k => {
        const v1 = m1[k] || "-";
        const v2 = m2[k] || "-";
        const isBlock = blocks.includes(k);

        html += `
          <tr>
            <td class="prop-col"><div class="prop-name">${k}</div></td>
            <td><div class="${isBlock ? 'val-block' : 'val-text'}">${v1}</div></td>
            <td><div class="${isBlock ? 'val-block' : 'val-text'}">${v2}</div></td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    init();
  </script>
</body>

</html>
